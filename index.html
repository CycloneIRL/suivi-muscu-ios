<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)">
<title>Suivi muscu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi muscu">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="fonts.css">
<script src="pwa.js"></script>
<style>
:root{--bg:#fafafa;--surface:#ffffff;--ink:#171717;--ink2:#525252;--line:#e4e4e7;--inv:#ffffff;--ok:#2B7A52;--bad:#B3261E;--t:#737373;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141415;--surface:#19191b;--ink:#ededed;--ink2:#a1a1a6;--line:#2a2a2d;--inv:#141415;--ok:#58B884;--bad:#F0786E;--onok:#0E2418}}
:root[data-theme="dark"]{--bg:#141415;--surface:#19191b;--ink:#ededed;--ink2:#a1a1a6;--line:#2a2a2d;--inv:#141415;--ok:#58B884;--bad:#F0786E;--onok:#0E2418}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);min-height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:8px 16px 120px;min-height:100vh}
h1,h2,h3,p{margin:0}
.h1,.top h1{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:36px;line-height:1.05}
h2{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;font-size:24px;margin:24px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.sub{color:var(--ink2);font-size:16px}
:root::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;pointer-events:none}
.hstick{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,0px));z-index:4;background:var(--bg);padding-bottom:4px}
.back{font-size:18px;font-weight:600;padding:8px 8px 8px 0}
.band{height:6px;border-radius:var(--r4);background:var(--t);margin:2px 0 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:var(--r8);background:var(--ink);color:var(--inv);font-weight:600;font-size:18px;width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sec[data-a="newTpl"],.btn.sec[data-a="tab"][data-k="prog"],.btn.sec[data-a="tab"][data-k="obj"]{border-width:2px;border-color:color-mix(in srgb,var(--ink) 55%,var(--line))}/* v93 : contour plus marqué de « Préparer une séance », « Voir mon programme » et « Régler mes objectifs » */
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{min-height:44px;width:auto;font-size:16px;padding:0 16px}
.link{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;padding:12px 0;display:block;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);padding:12px 16px}
.card.warn{border-color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:8px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);padding:16px 16px 16px 24px;min-height:72px;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:32px;overflow:hidden}
.tbtn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--c)}
.tbtn small{display:block;font-family:'Barlow',system-ui,sans-serif;font-weight:400;font-size:14px;color:var(--ink2)}
.resume{display:block;width:100%;text-align:left;border-left:9px solid var(--c);background:var(--surface);border-radius:var(--r8);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px}
.resume b{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:28px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:var(--r8);border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:16px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.search{width:100%;min-height:48px;border-radius:var(--r8);border:1.5px solid var(--line);background:var(--surface);padding:0 16px;margin:4px 0}
.field{display:block;width:100%;min-height:48px;border-radius:var(--r8);border:1.5px solid var(--line);background:var(--surface);padding:8px 16px}
textarea.field{min-height:84px;resize:vertical}
label.lab{display:block;font-weight:600;margin:16px 0 8px}
.prow,.entry,.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);padding:8px 12px;margin-bottom:8px;min-height:64px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.grow b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.grow small,small{color:var(--ink2);font-size:14px}
.thumb{width:44px;height:44px;border-radius:var(--r8);flex:none;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:24px;color:var(--ink2)}
.no{width:30px;height:32px;border-radius:50%;background:var(--t);color:#fff;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;text-shadow:0 0 2px rgba(0,0,0,.35)}
.chev{color:var(--ink2);font-size:24px}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:9px;height:8px;border-radius:50%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .lab2{font-weight:600;color:var(--ink2);font-size:14px}
.big{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.ago{font-weight:600;color:var(--ink)}
.sets{display:flex;flex-wrap:wrap;gap:4px 8px;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.hdr,.row{display:grid;grid-template-columns:20px minmax(0,1.5fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.hdr{color:var(--ink2);font-size:14px;text-align:center;margin:8px 0 2px}
.row{margin-bottom:8px}
.idx{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:20px;color:var(--ink2);text-align:center}
.step{display:flex;align-items:center;height:48px;border:1.5px solid var(--line);border-radius:var(--r8);background:var(--surface);overflow:hidden}
.step button{width:42px;height:100%;font-size:24px;color:var(--ink2);flex:none}
.step input{height:100%;min-width:0;flex:1;width:100%;padding:0;text-align:center;border:0;background:transparent;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;outline:none}
.chk{height:48px;border-radius:var(--r8);border:1.5px solid var(--line);background:var(--surface);font-size:24px;color:var(--ink2)}
.step.bwl{justify-content:center;border-style:dashed;background:transparent;color:var(--ink2);font-size:14px;padding:0 4px;text-align:center;line-height:1.2}.step.r button{width:30px}.hdr.bwr,.row.bwr{grid-template-columns:20px minmax(0,.8fr) minmax(0,1.2fr) 44px}.hdr.bwr.rw,.row.bwr.rw{grid-template-columns:20px minmax(0,1.2fr) minmax(0,.8fr) 44px}.row.bwr .step.r button{width:44px}.step.bwl{flex-direction:column;gap:0;font-size:12px}.step.bwl span{white-space:nowrap;font-size:11px;letter-spacing:0}.step.bwl b{font-size:14px;font-weight:600;color:var(--ink)}.step.w button{width:34px}
.row.done .step{border-color:var(--ok)}
.row.wu .idx{font-size:13px;font-weight:700;opacity:.8}.row.wu .step{opacity:.85}
.row.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.pr{font-size:12px;font-weight:600;color:var(--ok);grid-column:2/4;margin-top:-4px}
.acts{display:flex;gap:8px;margin-top:8px}
.acts .btn{flex:1}
.empty{color:var(--ink2);padding:16px 4px;text-align:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar div{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;height:56px;font-weight:600;font-size:14px;color:var(--ink2);padding:0 2px}
.tabbar button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--inv);border-radius:var(--r12);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;z-index:12}
.rest span{flex:1;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.rest button{min-height:44px;padding:0 12px;border-radius:var(--r8);border:1.5px solid var(--inv);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:var(--r16) var(--r16) 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet h3{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:28px;font-weight:700;margin-bottom:8px}
.photo{width:100%;max-height:60vh;object-fit:contain;border-radius:var(--r8)}
.pprev{width:100%;height:152px;object-fit:cover;border-radius:var(--r8);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--inv);padding:12px 16px;border-radius:var(--r8);font-weight:600;z-index:30;max-width:90%;text-align:center}
.toast:not(.snack){width:max-content}/* v91 : message large et bas (rectangle) plutôt que carré */
.chart{width:100%;height:auto;display:block}
.hl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow{flex-direction:column;align-items:stretch;gap:8px}
.swatches{display:flex;gap:8px;margin:8px 0 12px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background-clip:content-box;padding:4px}
.sw.on{border-color:var(--ink)}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:160px}
.coach{border-color:var(--ink)}
.tagk{font-size:12px;font-weight:600;border:1.5px solid var(--ink2);border-radius:var(--r8);padding:0 8px;line-height:20px;color:var(--ink2);white-space:nowrap}
.spark{flex:none;display:block}
.tr{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.tr.up{color:var(--ok)}.tr.dn{color:var(--bad)}
.grp{display:grid;grid-template-columns:104px 1fr 84px;gap:8px;align-items:center;margin-bottom:8px}
.grp .gname{font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.gbar{position:relative;height:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);overflow:hidden}
.gbar::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--line)}
.gbar i{position:absolute;top:2px;bottom:2px;border-radius:var(--r4)}
.gval{font-weight:600;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink2);font-size:14px;margin:8px 0 8px}
.ptrow{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 8px;border:1px solid var(--line);border-radius:var(--r8);background:var(--surface);margin-bottom:8px;min-height:48px}
.ptrow.sel{border-color:var(--ink);border-width:2px;padding:8px 8px}
.mini{min-width:44px;min-height:44px;border-radius:var(--r8);border:1.5px solid var(--line);font-size:18px}
.lbls{display:flex;flex-wrap:wrap}
.lbl{display:inline-block;border:1.5px solid var(--c);border-radius:var(--r8);padding:0 8px;font-size:12px;font-weight:600;line-height:20px;margin:4px 8px 0 0}
.restcfg{display:flex;align-items:center;gap:8px;margin:8px 0 0}
.restcfg span{flex:1}
.hdr.rw,.row.rw{grid-template-columns:20px minmax(0,1fr) minmax(0,1.5fr) 44px}
.chip{min-width:44px;justify-content:center}
.chip.sm{min-height:44px;padding:0 8px;font-size:14px;gap:4px}
.eqrow{border:1px solid var(--line);border-radius:var(--r8);background:var(--surface);padding:8px 8px;margin-bottom:8px}
.eqrow .chips{margin:8px 0 0}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g3 label{font-size:14px;color:var(--ink2);display:block;margin-bottom:4px}
.pv{color:var(--ink2);font-size:14px;margin-top:8px;overflow-wrap:anywhere}
@media (orientation:landscape) and (min-width:700px){
  #app{max-width:880px;padding-bottom:84px}
  .types{grid-template-columns:repeat(3,1fr)}
  .tabbar div{max-width:880px}
  .tabbar button{height:48px}
  .rest{max-width:856px}
  .sheet{max-width:720px;max-height:94vh}
  .row{max-width:640px}
  .hdr{max-width:640px}
}
/* v9 : retour au toucher, carte record, détail du coach repliable */
.btn,.chip,.chk,.step button,.tbtn,.prow,.entry,.tabbar button,.link,.rest button,.mini,.resume{transition:opacity .1s}
.btn:active,.sqbtn:active,.wday:active,.chip:active,.chk:active,.step button:active,.tbtn:active,.prow:active,.entry:active,.tabbar button:active,.link:active,.rest button:active,.mini:active,.resume:active{opacity:.55}
.big.nw{white-space:nowrap;font-size:28px}
.whyb{display:block;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px;text-align:left;font-size:16px}
/* v10 : sections repliables, bouton plein écran */
.acc{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:52px;padding:0 16px;margin-top:8px;border:1px solid var(--line);border-radius:var(--r8);background:var(--surface);font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;font-size:24px;text-align:left;transition:opacity .1s}
.acc:active{opacity:.55}
.acc>span:first-child{min-width:0;flex:1}
.acc .chev{flex:none}
.acc[aria-expanded=true]{border-color:var(--ink)}
.acc .chev{display:inline-block;transition:transform .15s}
.acc .chev{transition:transform .15s}
.acc[aria-expanded=true] .chev{transform:rotate(90deg)}
.accb{margin-top:8px;padding:4px 12px 16px;border-radius:var(--r12);border:1px solid color-mix(in srgb,var(--ink) 22%,var(--bg));background:color-mix(in srgb,var(--ink) 9%,var(--bg))}
.accb h2:first-child{margin-top:8px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--r8);border:2px solid color-mix(in srgb,var(--ink) 55%,var(--line));background:var(--surface);color:var(--ink);flex:none;transition:opacity .1s}/* v101 : même contour marqué que « Voir mon programme » (v93) */
.ibtn:active{opacity:.55}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hd2{display:flex;align-items:center;gap:8px}
.coachfoot{margin:16px 0 8px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.coachfoot small{display:block;margin:4px 0}
/* v27 : tours verrouillés, onglet Objectifs, chaîne dans le plan */
.row.lock .step,.row.lock .chk{opacity:.5}
.row.lock .step input{pointer-events:none}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shk .4s ease}
.row.lock.shake .step,.row.lock.shake .chk{border-color:var(--bad);opacity:1}
.pjn{position:relative;height:0;z-index:2}
.pjn .lk{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:26px;height:24px;background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.seg{display:flex;gap:4px;padding:4px;margin:8px 0 0;border-radius:var(--r12);background:var(--surface);border:1px solid var(--line)}
.seg button{flex:1;min-height:44px;border-radius:var(--r8);font-weight:600;font-size:16px;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--acc);color:var(--onacc)}
.sobj{margin:16px 0 0}
.sobj .rnm{margin:0 0 -4px}
.sobj .rnm .eqi{margin-left:auto}
.swhy{display:block;margin:8px 2px 0}
/* v25 : écran superset compact */
.sb{flex:none;width:30px;height:32px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:16px}
.sb.sm{width:24px;height:24px;font-size:14px}
.splan{display:flex;flex-direction:column;gap:8px;margin:8px -8px 0 -12px;padding:0 8px;border-left:4px solid var(--acc);border-radius:var(--r8)}
.spl{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);padding:8px 8px 8px 8px}
.spl .grow{min-width:0}
.spl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spl small{color:var(--ink2)}
.rline{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;text-align:left;margin:4px 0 0;font-size:14px;color:var(--ink)}
.rline .rreg{margin-left:auto;flex:none;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.srest{margin:2px 0 4px}
.srest .chip,.tchips .chip{padding:0 12px}
.rsum{display:flex;align-items:center;gap:8px;width:calc(100% + 20px);min-height:48px;margin:0 -8px 8px -12px;padding:8px 8px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:var(--r8);background:var(--surface)}
.rsum .rl{flex:none;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:18px}
.rsum .rv{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:0 8px;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rsum .rv b{color:var(--ink);font-weight:600}
.rsum.fin .rl{color:var(--ok)}
.chv{flex:none;color:var(--ink2);transition:transform .15s}
.chv.up{transform:rotate(180deg)}
.round{margin:0 -8px 8px -12px;padding:0 8px 8px;border-left:4px solid var(--acc);border-radius:var(--r8);background:color-mix(in srgb,var(--acc) 7%,transparent)}
.rlab{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:18px;text-align:left}
.hdr.sr2,.row.sr2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 44px}
.hdr.sr2.rw,.row.sr2.rw{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 44px}
.hdr.sr2{margin:-8px 0 0;font-size:14px;line-height:16px}

function wuCount(s,e){
  const W=WU();if(W.mode==='off'||W.mode==='free'||s.chill)return 0;
  const i=s.entries.indexOf(e);if(i<=0)return W.n1;
  if(W.mode==='first')return 0;
  if(W.mode==='each')return W.n2;
  const seen=new Set();s.entries.slice(0,i).forEach(q=>{const m=musOf(exOf(q.exId));m.p.concat(m.s).forEach(k=>seen.add(k))});
  return musOf(exOf(e.exId)).p.some(k=>!seen.has(k))?W.n2:0;

// ajoute n séries d'échauffement devant les séries de travail (charge = part de la 1re série de travail)
function wuAdd(s,e,n){
  const ex=exOf(e.exId);if(!n||bwx(ex)||entryGroup(s,e))return 0;
  const w0=(e.sets.find(x=>!x.wu)||{}).w;if(!(w0>0))return 0;
  const rows=[];(WUL[Math.min(4,n)]||[]).forEach(([p,r])=>{const w=nearLoad(ex,w0*p,true);if(w>0&&w<w0&&(!rows.length||w>rows[rows.length-1].w))rows.push({w,r,done:false,wu:true})});

function plaus(h){

  const avgR=(x,w)=>{const t=x.sets.filter(y=>y.w===w);return t.reduce((c,y)=>c+y.r,0)/t.length};
  const n=Math.min(h.length-1,8);

  for(let i=0;i<n;i++){
    const A=h[i],B=h[i+1],wa=top(A),wb=top(B);
    let v;
    if(wa>wb+1e-6)v=best(A)/best(B)>=.93?1:.35;
    else if(wa<wb-1e-6)v=0;
    else{const d=avgR(A,wa)-avgR(B,wb);v=d>=.5?1:d>-.5?.35:0}

function bigChart(pts,sel,unit){
  const W=340,H=200,L=44,Rm=14,T=12,B=28;
  const vs=pts.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs);

  pts.forEach((p,i)=>{
    const x=X(p.t).toFixed(1),y=Y(p.v).toFixed(1);
    if(i===sel)g+=`<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
    g+=p.deload?`<rect x="${(+x-5).toFixed(1)}" y="${(+y-5).toFixed(1)}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>`:`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--ink)" stroke="var(--bg)" stroke-width="2"/>`;
    g+=`<circle cx="${x}" cy="${y}" r="16" fill="transparent" data-a="pt" data-i="${i}"><title>${esc(fdate(p.t))} : ${num(p.v)} ${unit}</title></circle>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la force estimée">${g}</svg>`;
}

  <small>1 série : 60 % de ta charge de travail. 2 séries ou plus : montée en charge (50 puis 75 % pour 2 ; 40, 60, 80 % pour 3), avec peu de reps pour ne pas te fatiguer. Tu peux changer la charge à la main sur chaque ligne. Ces séries ne comptent ni dans les records, ni dans le coach, ni dans le volume.</small>`}

  ${acc('trash','Corbeille ('+trashList().length+')',trashHtml())}
  ${acc('gear','Matériel de la salle',gearHtml()+`  <h2>Incrément libre</h2><p class="sub">Pour les exercices dont le matériel est « Libre » ou non précisé.</p><div class="chips">${[1,2,2.5,5].map(v=>chip(num(v)+' kg',S.settings.step===v,`data-a="step" data-v="${v}"`)).join('')}</div>`)}

  <p class="sub" style="margin-bottom:8px">Selon la séance : UPPER propose UPPER, PUSH, PULL ; LOWER propose LOWER, LEGS ; FULL BODY n'affiche aucun filtre.</p>

  <div class="tylist">${S.types.map(t=>`<div class="tyrow"><button class="tyc" style="--c:${t.color}" data-a="tcol" data-t="${esc(t.name)}" aria-label="Changer la couleur de ${esc(t.name)}"></button><b>${esc(t.name)}</b>${delBtn('delType','Supprimer le type '+esc(t.name),`data-t="${esc(t.name)}"`)}</div>`).join('')}</div>
  <input class="field" id="newType" placeholder="Nouveau type (ex. FULL BODY)" data-f="newType">
  ${sws}
  <button class="btn sec" data-a="addType">Ajouter ce type</button>

  <p class="sub">Pour distinguer par exemple une tension en étirement d'une contraction sur le même muscle.</p>
  <div class="chips">${S.labels.map(l=>`<button class="chip" style="border-color:${l.color}" data-a="delLabel" data-t="${esc(l.name)}">${esc(l.name)} ✕</button>`).join('')}</div>
  <input class="field" id="newLabel" placeholder="Nouvelle étiquette (ex. Isolation)" data-f="newLabel">

  <button class="btn sec" data-a="addLabel">Ajouter cette étiquette</button>
`)}
  ${acc('help','Comment fonctionne le coach',`  <p class="sub" style="margin-bottom:8px">Le coach propose un objectif pour chaque exercice à partir de ta dernière séance hors deload, de ta fourchette de répétitions et des charges que tu peux réellement monter.</p>
  <p class="sub" style="margin-bottom:8px">Progression double : tu gardes la charge jusqu'à atteindre le haut de ta fourchette sur tes séries (à 1 rep près au total), puis tu passes au cran de charge suivant et tu repars du nombre de reps qui donne à peu près la même force.</p>
  <p class="sub" style="margin-bottom:8px">Il tient compte de ton historique : après une longue série de progrès, ou quand les progrès se sont espacés, il demande des pas plus petits. Il ne t'affiche aucune probabilité de réussite.</p>
  <p class="sub" style="margin-bottom:8px">Ressenti « facile » : il saute un cran si le saut reste petit. Ressenti « à fond » : tu consolides avant de pousser. Cran de charge trop large (haltères de 6 à 8 kg par exemple) : il propose de ralentir la descente ou de marquer une pause avant de changer de charge. Deux séances de suite sous le bas de la fourchette : la charge baisse d'un cran.</p>
  <p class="sub" style="margin-bottom:8px">Plateau : pas de meilleur 1RM estimé en 3 séances. ${dlWkV()?'Deload conseillé après '+dlWkV()+' semaines'+(dlWkV()>4?', ou 4 semaines si au moins 2 exercices stagnent':'')+' (réglable plus haut).':'Alerte deload désactivée (réglable plus haut).'} Une séance chill compte ses séries dans ton volume, mais jamais dans les objectifs, les records ni les courbes. Les séances deload ne servent pas de base de calcul : environ la moitié des séries, mêmes reps, charge −${dlPV()} % (réglable plus haut). Mode Malade : 1 à 2 séries, charge à peu près −30 %, et la séance est elle aussi ignorée pour la suite. Mode Déplacement (autre salle, vacances) : la séance est enregistrée, mais ses exos ne comptent ni pour le coach, ni pour les records, ni pour les courbes, sauf ceux que tu coches « Compter ». Les séries comptent quand même dans le volume de la semaine.</p>
  <p class="sub">Le nombre de séries visé (3 par défaut), la fourchette, le matériel et les charges spécifiques se règlent exercice par exercice, dans la fiche de l'exercice.</p>
`)}
  ${acc('data','Données et démo',`  <h2>Données de test</h2>

  <div class="acts"><button class="btn sec" data-a="export">Exporter</button><button class="btn sec" data-a="import">Importer</button></div>

/* ---------- modales ---------- */
const FAM={UPPER:['UPPER','PUSH','PULL'],PUSH:['PUSH','UPPER'],PULL:['PULL','UPPER'],LOWER:['LOWER','LEGS'],LEGS:['LEGS','LOWER']};
const nk=x=>String(x||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z]/g,'');
const visTypes=t=>{
  if(S.settings.pickScope==='all'||!t)return S.types;
  const k=nk(t);
  if(/^FULL|CORPS/.test(k))return [];
  const fam=FAM[k];if(!fam)return S.types;
  const r=S.types.filter(x=>x.name===t||fam.includes(nk(x.name)));
  return r.length?r:S.types;
};
const pickF=t=>visTypes(t).length?t:null;
const pickSessType=m=>m.target==='session'?(active()||{}).type:m.target==='past'?(sessOf(ui.pastSid)||{}).type:(ui.draft||{}).type;
const pickTypes=m=>visTypes(pickSessType(m));
const tfilt=chips=>{const t=chips.slice(1),n=t.length,r=n%3;return `<div class="chips grid tf" style="margin-top:0">${[chips[0].replace('class="chip','class="chip wide'),...t.map((c,i)=>r&&i>=n-r?c.replace('class="chip','class="chip w'+(r===1?6:3)):c)].join('')}</div>`};
const tgrid=(labels,chips)=>{const n=labels.length,L=Math.max(...labels.map(x=>String(x).length));const c=n<=3?n:n===4?(L<=5?4:2):3;return `<div class="chips grid${c===4?' dense':''}" style="--c:${c};margin-top:0">${chips.join('')}</div>`};
function pickRefresh(){
  const m=ui.modal,sh=document.querySelector('.sheet.pick'),L=document.getElementById('pickList');
  if(!m||m.n!=='picker'||!sh||!L)return false;
  sh.querySelectorAll('[data-a="pf"]').forEach(b=>{const on=(b.dataset.t||null)===(m.f||null);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  sh.querySelectorAll('[data-a="pl"]').forEach(b=>{const on=m.l===b.dataset.t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  sh.querySelectorAll('[data-a="psort"]').forEach(b=>{const on=(b.dataset.v==='recent')===(S.settings.pickSort==='recent');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  L.innerHTML=pickList();L.scrollTop=0;return true;
}
function pickList(){
  const m=ui.modal;
  const used=new Set(m.target==='session'?active().entries.map(e=>e.exId):m.target==='past'?sessOf(ui.pastSid).entries.map(e=>e.exId):ui.draft.exIds);
  const q=m.q.trim();
  const lastT=e=>{const h=hist(e.id);return h.length?h[0].s.start:0};
  const list=S.exercises.filter(e=>!used.has(e.id)&&(!m.f||e.tags.includes(m.f))&&(!m.l||(e.labels||[]).includes(m.l))&&(!q||nameHas(e.name,q))).sort((a,b)=>(S.settings.pickSort==='recent'?lastT(b)-lastT(a):0)||a.name.localeCompare(b.name,'fr'));
  if(!list.length)return `<p class="empty">Aucun exercice${m.f?' '+esc(m.f):''} à proposer. Crée-le juste en dessous.</p>`;
  return list.map(e=>{const h=hist(e.id);return `<button class="prow" data-a="pick" data-id="${e.id}">${thumb(e)}<span class="grow"><b>${esc(e.name)}</b><small>${h.length?'Dernière fois '+ago(h[0].s.start):'Jamais fait'}</small></span>${eqIcon(e)}</button>`}).join('');
}
function modalView(){
  const m=ui.modal;
  const wrap=(inner,cls)=>`<div class="ov" data-a="ovclose"><div class="sheet${cls?' '+cls:''}" role="dialog" aria-modal="true">${inner}</div></div>`;
  if(m.n==='picker'){
    const n=m.target==='session'?active().entries.length+1:m.target==='past'?sessOf(ui.pastSid).entries.length+1:ui.draft.exIds.length+1;
    const sb=m.target==='session'&&ui.supFor&&active().entries.find(x=>x.id===ui.supFor);
    return wrap(`<h3>${m.swap?'Remplacer par…':sb?'Superset avec '+esc(exOf(sb.exId).name):'Exercice '+n}</h3>${sb?'<p class="sub" style="margin:-4px 0 8px">Choisis l\'exercice à enchaîner juste après, sans repos entre les deux.</p>':''}
    ${(()=>{const v=pickTypes(m);return v.length?tfilt([chip('Tous',!m.f,'data-a="pf" data-t=""'),...v.map(t=>chip(t.name,m.f===t.name,`data-a="pf" data-t="${esc(t.name)}"`,t.color))]):''})()}
    ${S.labels.length?`<div class="chips" style="margin-top:0">${S.labels.map(l=>chip(l.name,m.l===l.name,`data-a="pl" data-t="${esc(l.name)}"`)).join('')}</div>`:''}
    <div class="srow"><input class="search" data-f="pq" placeholder="Rechercher" aria-label="Rechercher un exercice" value="${esc(m.q)}">${S.settings.pickSort==='recent'?chip('Récents','true','data-a="psort" data-v="az" aria-label="Tri : récents d\'abord. Passer à A à Z"'):chip('A à Z','true','data-a="psort" data-v="recent" aria-label="Tri : A à Z. Passer à récents d\'abord"')}</div>
    <div id="pickList" style="margin-top:4px">${pickList()}</div>
    <div class="acts"><button class="btn sec" data-a="createFromPicker">Nouvel exo</button><button class="btn sec" data-a="ovclose2">Fermer</button></div>`,'pick');
  }
  if(m.n==='tcol'){
    const ty=S.types.find(x=>x.name===m.t);if(!ty)return wrap('<h3>Couleur</h3><div class="acts"><button class="btn sec" data-a="ovclose2">Fermer</button></div>');
    const cur=(ty.color||'').toUpperCase();
    return wrap(`<h3>Couleur de ${esc(ty.name)}</h3><div class="tpal">${TPAL.map(c=>`<button class="tyc${c.toUpperCase()===cur?' on':''}" style="--c:${c}" data-a="tcolSet" data-v="${c}" aria-label="Couleur ${c}" aria-pressed="${c.toUpperCase()===cur}">${c.toUpperCase()===cur?ICO('<path d="M5 12.5l4.5 4.5L19 7.5"/>',24,3):''}</button>`).join('')}</div>
    <label class="tcustom"><input type="color" data-f="tcolc" value="${esc(cur||'#737373')}"><span>Autre couleur</span></label>
    <div class="acts"><button class="btn sec" data-a="ovclose2">Fermer</button></div>`);
  }
  if(m.n==='swap'){
    const s=active(),e=s&&s.entries.find(x=>x.id===m.eid),ex=e&&exOf(e.exId);
    if(!ex)return wrap('<h3>Remplacer</h3><p class="empty">Exercice introuvable.</p><div class="acts"><button class="btn sec" data-a="ovclose2">Fermer</button></div>');
    const L=equivs(ex,s);
    return wrap(`<h3>Remplacer ${esc(ex.name)}</h3><p class="sub" style="margin:-4px 0 8px">${L.length?'Même muscle, même tension, même mouvement : les plus proches en premier.':'Aucun équivalent trouvé dans tes exercices.'}</p>
    <div id="pickList" style="margin-top:4px">${L.map(x=>`<button class="prow" data-a="swapDo" data-id="${x.ex.id}">${thumb(x.ex)}<span class="grow"><b>${esc(x.ex.name)}</b><small>${esc(x.why.join(' · ')||'proche')}</small></span>${eqIcon(x.ex)}</button>`).join('')}</div>
    <div class="acts"><button class="btn sec" data-a="swapAll">Voir tous</button><button class="btn sec" data-a="ovclose2">Fermer</button></div>`,'pick');
  }
  if(m.n==='exedit'){
    const d=m.draft;
    return wrap(`<h3>${m.id?'Modifier l\'exercice':'Nouvel exercice'}</h3>
    <label class="lab">Nom</label><input class="field" data-f="dname" placeholder="Ex. Développé couché" value="${esc(d.name)}">
    <label class="lab">Types</label><div class="chips" style="margin-top:0">${S.types.map(t=>chip(t.name,d.tags.includes(t.name),`data-a="dtag" data-t="${esc(t.name)}"`,t.color)).join('')}</div>
    <label class="lab">Muscles travaillés</label><div class="chips" style="margin-top:0">${(m=>MUS.map(([k])=>{const st=m.p.includes(k)?'p':m.s.includes(k)?'s':'';return `<button class="chip${st?' on':''}${st==='s'?' half':''}" aria-pressed="${!!st}" data-a="dmus" data-v="${k}">${st==='s'?'½ ':''}${MUSS[k]}</button>`}).join(''))(d.mus||musGuess(d.name))}</div><small>1 toucher : principal. 2 : secondaire (½ série). 3 : retiré.${d.mus?'':' Deviné d\'après le nom.'}</small>
    <label class="lab">Matériel</label><div class="chips" style="margin-top:0">${EQ.map(([k,l])=>chip(l,d.equip===k,`data-a="deq" data-v="${k}"`)).join('')}</div>${d.equip?'':`<small>Non choisi : deviné d'après le nom, sinon libre.</small>`}
    ${d.equip==='plates'?`<label class="lab">Poids à vide (kg)</label><input class="field" inputmode="decimal" data-f="dbase" placeholder="Défaut ${num(gear().bar)} kg (barre). Machine : poids du chariot, ou 0" value="${esc(d.base)}">`:''}
    ${d.equip==='bw'?'':`<label class="lab">Mes charges pour cet exercice (facultatif)</label><input class="field" data-f="dcustom" placeholder="Ex. 5 10 15 20 25 30" value="${esc(d.custom)}"><small>Un cran par poids, séparés par un espace (10 20 30 40 50), ou une plage : 10-60/5. Les boutons − et + suivent cette liste.</small>`}${d.equip==='stack'?`<label class="lab">Mini-charge à ajouter sur la poulie (facultatif)</label><input class="field" data-f="daddon" placeholder="${esc(S.settings&&gear().stack.add?'Par défaut : '+gear().stack.add:'Ex. 1,25')}" value="${esc(d.addon)}"><small>Petite plaque posée sur la pile, ajoutée à chaque cran (10 kg + 1,25 = 11,25 kg). Plusieurs possibles : 1,25 2,5.</small>`:''}${d.equip==='db'||d.equip==='plates'||d.equip==='stack'?'':`<label class="lab">Pas de progression (kg)</label><input class="field" inputmode="decimal" data-f="dinc" placeholder="Par défaut : ${num(S.settings.step)} kg" value="${esc(d.inc)}">`}
    <label class="lab">Étiquettes (type de tension)</label><div class="chips" style="margin-top:0">${S.labels.map(l=>chip(l.name,d.labels.includes(l.name),`data-a="dlbl" data-t="${esc(l.name)}"`)).join('')}</div>
    <div style="display:flex;gap:8px"><input class="field" data-f="dnewlabel" placeholder="Nouvelle étiquette" value="${esc(d.newLabel)}"><button class="btn sm sec" style="min-height:48px" data-a="dAddLabel">Ajouter</button></div>
    <label class="lab">Temps de repos (secondes)</label><input class="field" inputmode="numeric" data-f="drest" placeholder="Par défaut : ${S.settings.rest} s" value="${esc(d.rest)}">
    <label class="lab">Nombre de séries visé</label><div class="chips" style="margin-top:0">${[2,3,4,5,6].map(n=>chip(String(n),(d.nsets||3)===n,`data-a="dns" data-v="${n}"`)).join('')}</div>
    ${(d.equip||guessEq(d.name))==='bw'?`<label class="lab">Lestage possible</label><div class="chips" style="margin-top:0">${chip('Non',!d.lest,'data-a="dlest" data-v="0"')}${chip('Oui',!!d.lest,'data-a="dlest" data-v="1"')}</div><small>Non : l'objectif augmente les reps jusqu'au haut de ta fourchette, puis te conseille ralentir ou changer de variante. Oui : à ce stade, je propose du lest.</small>`:''}
    <label class="lab">Les répétitions que tu notes sont</label><div class="chips" style="margin-top:0">${chip('Au total',!d.perArm,'data-a="darm" data-v="0"')}${chip('Par bras',!!d.perArm,'data-a="darm" data-v="1"')}</div><small>Curl haltères : 12 par bras = 24 au total. Garde toujours la même façon de noter.</small>
    <label class="lab">Répétitions visées pour cet exercice</label><div style="display:flex;gap:8px"><input class="field" inputmode="numeric" data-f="drmin" placeholder="Min (${repRange({}).min})" value="${esc(d.rmin)}" aria-label="Répétitions minimum"><input class="field" inputmode="numeric" data-f="drmax" placeholder="Max (${repRange({}).max})" value="${esc(d.rmax)}" aria-label="Répétitions maximum"></div><small>${d.rmin||d.rmax?'Fourchette propre à cet exercice.':'Vide : ta fourchette générale ('+repRange({}).min+' à '+repRange({}).max+' reps, modifiable dans Réglages) s\'applique.'} Ex. 15 et 20 pour des élévations latérales.</small>
    <label class="lab">Photo de la machine</label>
    <input type="file" accept="image/*" data-f="dphoto" class="field" style="padding:8px">
    ${d.photo?`<img class="pprev" src="${d.photo}" alt="">${delBtn('dnophoto','Retirer la photo','',XICO)}`:''}
    <label class="lab">Notes (réglages, siège, prise)</label><textarea class="field" data-f="dnote" placeholder="Ex. siège cran 4, dossier cran 2">${esc(d.note)}</textarea>
    <div class="acts" style="margin-top:16px"><button class="btn sec" data-a="ovclose2">Annuler</button><button class="btn" data-a="saveEx">Enregistrer</button></div>
    ${m.id?`<div class="delrow">${delBtn('delEx','Supprimer l\'exercice')}</div>`:''}`);
  }
  if(m.n==='eqs'){

/* v40 filet tactile : si un appui au doigt ne produit aucun clic (le navigateur « perd » le tap),
   on le note dans « Bugs évités » avec l'élément touché, puis on rejoue l'action une seule fois */
let tapD=null,lastClk=0,synthAt=-1e9;
addEventListener('click',ev=>{
  if(ev.isTrusted&&performance.now()-synthAt<800){ev.stopImmediatePropagation();ev.preventDefault();return}
  lastClk=performance.now();
},true);
addEventListener('pointerdown',ev=>{tapD=ev.pointerType==='mouse'?null:{x:ev.clientX,y:ev.clientY,t:performance.now(),id:ev.pointerId}},true);
addEventListener('pointercancel',()=>{tapD=null},true);
addEventListener('pointerup',ev=>{
  const d=tapD;tapD=null;
  if(!d||d.id!==ev.pointerId||Math.abs(ev.clientX-d.x)>10||Math.abs(ev.clientY-d.y)>10||performance.now()-d.t>600)return;
  const x=ev.clientX,y=ev.clientY,c0=lastClk;
  setTimeout(()=>{safe(()=>{
    if(lastClk!==c0)return;
    const el=document.elementFromPoint(x,y),b=el&&el.closest&&el.closest('[data-a]');
    if(!b)return;
    logErr(new Error('appui sans clic sur '+b.dataset.a+' ('+(el.className&&el.className.baseVal===undefined?el.className:el.tagName)+')'),'tactile');
    synthAt=performance.now();
    b.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
  },'tactile')},350);
},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.type!=='file')ev.target.blur()});
/* v72 sonde tactile : « le bas de l'écran ne clique plus ». À chaque appui au doigt, on compare ce que le navigateur a touché (ev.target)
   avec ce que la mise en page actuelle place sous le doigt (elementFromPoint). Un écart ou un bouton du bas capté par autre chose est noté
   dans Réglages > Données > « Bugs évités » (max 1 note par seconde). */
(()=>{let last=0;
  const nm=e=>e?(e.tagName+(e.className&&e.className.baseVal===undefined&&e.className?'.'+String(e.className).trim().split(/\s+/)[0]:'')):'rien';
  addEventListener('pointerdown',ev=>{try{
    if(ev.pointerType==='mouse'||performance.now()-last<1000)return;
    const x=ev.clientX,y=ev.clientY,t=ev.target,u=document.elementFromPoint(x,y),vb=document.querySelector('.vbar');
    let why='';
    if(t!==u&&!(t.contains&&u&&(t.contains(u)||u.contains(t))))why='cible '+nm(t)+' ≠ sous le doigt '+nm(u);
    else if(vb){const bt=[...vb.querySelectorAll('.vbtn')].find(b=>{const r=b.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom});
      if(bt&&!(t.closest&&t.closest('.vbtn')))why='bouton du bas capté par '+nm(t)}
    if(!why)return;
    last=performance.now();const vv=window.visualViewport,r=vb?vb.getBoundingClientRect():null;
    logErr(new Error('appui '+why+' | y='+Math.round(y)+' H='+innerHeight+' vv='+(vv?Math.round(vv.height)+'/'+Math.round(vv.offsetTop):'-')+' barre='+(r?Math.round(r.top)+'-'+Math.round(r.bottom):'-')+' scroll='+Math.round(scrollY)),'sonde');
  }catch(e){}},true);
})();


/* ---------- démo ---------- */
function loadDemo(){
  if(S.sessions.some(x=>x.demo)){toast('La démo est déjà chargée');return}
  let sd=42;const R=()=>{sd=(sd*1664525+1013904223)%4294967296;return sd/4294967296};
  ['UPPER','LOWER','PUSH','PULL','LEGS'].forEach(n=>{if(!S.types.some(t=>t.name===n))S.types.push({name:n,color:COLORS[S.types.length%COLORS.length]})});
  const ensL=(n,c)=>{if(!S.labels.some(l=>l.name===n))S.labels.push({name:n,color:c})};
  ensL(LBL_ETI,COLORS[4]);ensL(LBL_CON,COLORS[5]);
  const X=(name,tags,labels,rest,base,gain,sets,reps,step)=>{
    let e=S.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!e){e={id:uid(),name,tags,photo:null,note:'',labels:labels.slice(),rest,created:now(),demo:true};S.exercises.push(e)}
    else{if(!(e.labels||[]).length&&labels.length)e.labels=labels.slice();if(!e.rest)e.rest=rest}
    return {id:e.id,base,gain,sets,reps,step};
  };
  const U=['UPPER','PUSH'],P=['UPPER','PULL'],L=['LOWER','LEGS'];
  const DC=X('Développé couché',U,[LBL_CON],150,70,0.9,4,6,2.5),INC=X('Développé incliné haltères',U,[LBL_CON],120,24,0.3,3,9,1),
    FLY=X('Pec fly',U,[LBL_ETI],90,40,0.5,3,12,1),LAT=X('Élévations latérales',U,[],60,8,0.12,3,14,1),TRI=X('Triceps poulie',U,[],75,25,0.4,3,12,1),
    TIR=X('Tirage vertical',P,[LBL_ETI],105,60,0.7,4,10,2.5),ROW=X('Rowing barre',P,[LBL_CON],120,60,0.8,4,8,2.5),
    MIL=X('Développé militaire',U,[],120,40,0.6,3,8,2.5),CURL=X('Curl biceps',P,[],75,15,0.25,3,10,1),
    SQ=X('Squat',L,[],180,80,1.2,4,6,2.5),PRE=X('Presse à cuisses',L,[],150,160,2,4,10,5),RDL=X('Soulevé de terre roumain',L,[LBL_ETI],150,80,1,3,8,2.5),
    LC=X('Leg curl',L,[LBL_ETI],90,40,0.5,3,12,1),MOL=X('Mollets debout',L,[],60,70,1,4,12,2.5);
  const plan=[['Upper A (push)','UPPER',[DC,INC,FLY,LAT,TRI]],['Lower','LOWER',[SQ,PRE,RDL,LC,MOL]],['Upper B (pull)','UPPER',[TIR,ROW,MIL,CURL,LAT]]];
  const cnt={},today=D0(now());
  for(let w=0;w<10;w++)for(let j=0;j<3;j++){
    if(R()<0.1)continue;
    const dayOff=70-(w*7+j*2+(j&&R()<0.4?1:0));if(dayOff<1)continue;
    const start=today-dayOff*864e5+(17*60+Math.floor(R()*90))*60000;
    const [name,type,list]=plan[j];
    const entries=list.map(d=>{
      const k=cnt[d.id]=(cnt[d.id]||0)+1;
      let wt=d.base+d.gain*(k-1);if(R()<0.18)wt-=d.step*2;
      wt=Math.max(d.step,Math.round(wt/d.step)*d.step);
      const sets=[];for(let i=0;i<d.sets;i++)sets.push({w:wt,r:Math.max(3,d.reps+(R()<0.3?1:0)-(i>=d.sets-1?1:0)),done:true});
      return {id:uid(),exId:d.id,sets};
    });
    if(j===2){const g=uid();entries.slice(-2).forEach(x=>{x.grp=g})}
    S.sessions.push({id:uid(),type,name,start,end:start+(50+Math.floor(R()*25))*60000,entries,demo:true});
  }
  const dcSess=S.sessions.filter(x=>x.demo&&x.entries.some(e=>e.exId===DC.id)).sort((a,b)=>b.start-a.start)[0];
  if(dcSess)dcSess.entries.find(e=>e.exId===DC.id).sets.forEach(x=>{x.w+=2.5});
  plan.forEach(([name,type,list],j)=>S.templates.push(Object.assign({id:uid(),name,type,exIds:list.map(d=>d.id),demo:true},j===2?{grps:list.map((d,k)=>k>=list.length-2?'ss':null)}:{})));
  save();render();toast('Démo chargée');
}

  S.exercises.forEach(e=>{m['ex_'+e.id]=canon(e)});
  S.sessions.forEach(x=>{m['s_'+x.id]=canon(x)});
  return m;
}
function schedule(){if(!cloud.ok)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(flush,700)}
async function flush(){
  if(!cloud.ok)return;
  if(cloud.busy){cloud.dirty=true;return}
  cloud.busy=true;
  try{
    do{
      cloud.dirty=false;
      const cur=docsOf(),col=cloud.db.collection('data/users/'+cloud.uid);
      for(const k of Object.keys(cur)){if(cloud.known[k]!==cur[k]){await col.doc(k).set(JSON.parse(cur[k]));cloud.known[k]=cur[k]}}
      for(const k of Object.keys(cloud.known)){if(!(k in cur)){await col.doc(k).delete();delete cloud.known[k]}}
    }while(cloud.dirty);
    cloud.state='ok';cloud.warned=false;
    try{localStorage.removeItem(KEY+'.dirty')}catch(e){}
  }catch(e){
    cloud.state='error';
    if(!cloud.warned){cloud.warned=true;toast(e&&e.code==='quota_exceeded'?'Sauvegarde en ligne pleine : exporte tes données':'Sauvegarde en ligne échouée, nouvel essai à la prochaine saisie')}
  }
  cloud.busy=false;
}
function build(docs){
  const m=docs.meta||{};
  const o={v:1,types:m.types||[],labels:m.labels||defLabels(),templates:m.templates||[],settings:m.settings||{step:2.5,rest:90},activeId:m.activeId||null,exercises:[],sessions:[]};
  Object.keys(docs).forEach(k=>{if(k.startsWith('ex_'))o.exercises.push(docs[k]);else if(k.startsWith('s_'))o.sessions.push(docs[k])});
  o.exercises.sort((a,b)=>(a.created||0)-(b.created||0));o.sessions.sort((a,b)=>a.start-b.start);
  return norm(o);
}
function mergeLocal(rem,loc){
  const mp=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));b.forEach(x=>m.set(x.id,x));return [...m.values()]};
  const o=Object.assign({},loc);
  o.exercises=mp(rem.exercises,loc.exercises);o.sessions=mp(rem.sessions,loc.sessions).sort((a,b)=>a.start-b.start);
  return o;
}
function softRender(){const ae=document.activeElement;if(!ui.modal&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))render()}
async function initCloud(){
  try{
    if(!window.claude||typeof claude.use!=='function'){cloud.state='local';softRender();return}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=db&&user?await user.id():null;
    if(!db||!uid){cloud.state='local';softRender();return}
    // shortcut: 1000 documents max (≈ 6 ans à 3 séances par semaine), à paginer ensuite
    const snap=await db.collection('data/users/'+uid).limit(1000).get();
    const docs={};snap.docs.forEach(d=>{docs[d.id]=JSON.parse(JSON.stringify(d.data()))});
    let dirty=false;try{dirty=localStorage.getItem(KEY+'.dirty')==='1'}catch(e){}
    cloud.db=db;cloud.uid=uid;cloud.known={};
    if(docs.meta){
      const rem=build(docs);
      S=dirty?mergeLocal(rem,S):rem;
      Object.keys(docs).forEach(k=>{cloud.known[k]=canon(docs[k])});
    }
    cloud.ok=true;cloud.state='ok';
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    await flush();
    softRender();
  }catch(e){cloud.ok=false;cloud.state='local';softRender()}
}
/* v104 : l'appli Android garde tout sur le téléphone ; rappel d'export tous les 14 jours (report de 3 jours avec « Plus tard ») */
function exportBanner(){
  const st=S.settings,D=864e5,t=now();
  if(!S.sessions.some(x=>x.end&&!x.demo))return '';
  if(t-(st.lastExport||0)<=14*D||t-(st.exAsk||0)<=3*D)return '';
  const when=st.lastExport?'Dernier export il y a '+Math.floor((t-st.lastExport)/D)+' jours.':'Aucun export pour l\'instant.';
  return `<div class="card warn" style="margin-bottom:8px"><b>Sauvegarde tes données</b><br><small>${when} Tes séances ne sont que sur ce téléphone : si tu désinstalles l’appli ou effaces ses données, elles sont perdues.</small><div class="acts" style="margin-top:8px"><button class="btn sec" data-a="exLater">Plus tard</button><button class="btn" data-a="export">Exporter</button></div></div>`;
}
function cloudBanner(){
  if(NAT)return exportBanner();
  if(cloud.state==='local')return `<div class="card warn" style="margin-bottom:8px"><b>Sauvegarde en ligne inactive</b><br><small>Données gardées dans ce navigateur seulement. Exporte-les dans Réglages.</small></div>`;
  if(cloud.state==='error')return `<div class="card warn" style="margin-bottom:8px"><b>Dernière sauvegarde en ligne échouée</b><br><small>Nouvel essai à ta prochaine saisie. Tes données restent sur cet appareil.</small></div>`;
  return '';
}
function cloudLine(size){
  if(NAT)return `Données gardées sur ce téléphone seulement (${size} Ko).`;
  if(cloud.state==='ok')return `Sauvegarde en ligne active : tes séances sont aussi enregistrées sur ton compte et reviennent même si le navigateur est vidé (${size} Ko sur cet appareil).`;
  if(cloud.state==='pending')return 'Connexion à la sauvegarde en ligne…';
  if(cloud.state==='error')return `La dernière sauvegarde en ligne a échoué. Tes données restent sur cet appareil (${size} Ko).`;
  return `Sauvegarde en ligne indisponible ici : tes données ne sont que dans ce navigateur (${size} Ko).`;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cloud.ok){clearTimeout(cloud.timer);flush()}wake()});
document.addEventListener('fullscreenchange',()=>softRender());

/* ---------- horloge ---------- */
setInterval(()=>{
  const a=active();
  document.querySelectorAll('[data-elapsed]').forEach(el=>{if(a)el.textContent=dur(a)});
  if(ui.rest){
    const el=document.getElementById('restT');if(el)el.textContent=restText(true);const lb=document.getElementById('restL');if(lb)lb.textContent=restLab();const rb=document.getElementById('restB');if(rb)rb.style.width=restPct()+'%';
    if(!ui.rest.over&&ui.rest.end<=now()){

},1000);

render();
if(loadBad)toast('Données illisibles : une copie a été gardée sur cet appareil');

/* v53 : glisser-déposer des muscles entre priorités (appui long au doigt, glisser direct à la souris) */
(function(){
  let d=null,tm=null,st=null,sup=0,iv=null;
  const grpAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest('.pgrp'):null};
  const clr=()=>document.querySelectorAll('.pgrp.over').forEach(g=>g.classList.remove('over'));
  function begin(el,x,y){
    const r=el.getBoundingClientRect(),gh=el.cloneNode(true);
    gh.className='pcard dragghost';gh.style.width=r.width+'px';gh.removeAttribute('data-a');document.body.appendChild(gh);
    el.classList.add('drag');d={el,gh,m:el.dataset.m,over:null,x,y};move(x,y);
    try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
    iv=setInterval(()=>{if(!d)return;if(d.y<90)scrollBy(0,-12);else if(d.y>innerHeight-130)scrollBy(0,12)},16);
  }
  function move(x,y){
    d.x=x;d.y=y;d.gh.style.left=x+'px';d.gh.style.top=y+'px';
    const g=grpAt(x,y);if(g!==d.over){clr();if(g)g.classList.add('over');d.over=g}
  }
  function end(drop){
    clearTimeout(tm);tm=null;st=null;
    if(!d)return;
    const {el,gh,m,over}=d;d=null;clearInterval(iv);clr();gh.remove();el.classList.remove('drag');sup=Date.now();
    if(drop&&over){
      const fk=over.dataset.fk,P=prog();
      if(fk!==(P.focus[m]||'')){if(fk)P.focus[m]=fk;else delete P.focus[m];save();const y=scrollY;render();scrollTo(0,y)}
    }
  }
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest&&e.target.closest('.pcard');if(!el||e.button>0)return;
    st={el,x:e.clientX,y:e.clientY,mouse:e.pointerType==='mouse'};
    if(!st.mouse)tm=setTimeout(()=>{if(st){begin(st.el,st.x,st.y)}},260);
  },true);
  document.addEventListener('pointermove',e=>{
    if(d){move(e.clientX,e.clientY);return}
    if(!st)return;
    const dist=Math.hypot(e.clientX-st.x,e.clientY-st.y);
    if(st.mouse){if(dist>6)begin(st.el,e.clientX,e.clientY)}
    else if(dist>10){clearTimeout(tm);tm=null;st=null}
    else{st.x=e.clientX;st.y=e.clientY}
  },true);
  document.addEventListener('pointerup',()=>end(true),true);
  document.addEventListener('pointercancel',()=>end(false),true);
  document.addEventListener('touchmove',e=>{if(d)e.preventDefault()},{passive:false});
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.pcard'))e.preventDefault()});
  document.addEventListener('click',e=>{if(Date.now()-sup<400&&e.target.closest&&(e.target.closest('.pcard')||e.target.closest('.pgrp'))){e.stopPropagation();e.preventDefault()}},true);
})();

/* v57 : changer l'ordre des exercices par glisser-déposer (poignée), séance en cours et séance préparée ; flèches haut/bas au clavier */
(function(){
  let d=null,iv=null,sup=0;
  const rowsOf=l=>[...l.querySelectorAll('[data-ri]')];
  const clr=()=>document.querySelectorAll('.dropb,.dropa').forEach(x=>x.classList.remove('dropb','dropa'));
  // position cible : nombre de lignes (hors la ligne déplacée) dont le centre est au-dessus du doigt
  function target(y){let t=0;d.rows.forEach(r=>{if(r===d.el)return;const b=r.getBoundingClientRect();if(b.top+b.height/2<y)t++});return t}
  function mark(t){clr();const o=d.rows.filter(r=>r!==d.el);if(!o.length)return;if(t<o.length)o[t].classList.add('dropb');else o[o.length-1].classList.add('dropa')}
  function begin(el,l,x,y){
    const r=el.getBoundingClientRect(),gh=el.cloneNode(true);
    gh.className=el.className+' dragghost';gh.style.width=r.width+'px';gh.style.left=(r.left+r.width/2)+'px';gh.removeAttribute('data-a');document.body.appendChild(gh);
    d={el,l,gh,rows:rowsOf(l),from:+el.dataset.ri,kind:l.dataset.rl,y,t:+el.dataset.ri};
    el.classList.add('drag');document.body.classList.add('dragging');move(y);
    try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
    iv=setInterval(()=>{if(!d)return;if(d.y<90)scrollBy(0,-12);else if(d.y>innerHeight-130)scrollBy(0,12);d.t=target(d.y);mark(d.t)},16);
  }
  function move(y){d.y=y;d.gh.style.top=y+'px';d.t=target(y);mark(d.t)}
  function end(drop){
    if(!d)return;
    const {el,gh,from,t,kind}=d;d=null;clearInterval(iv);clr();gh.remove();el.classList.remove('drag');document.body.classList.remove('dragging');sup=Date.now();
    if(drop&&t!==from){const y=scrollY;A.reord(kind,from,t);scrollTo(0,y)}
  }
  setInterval(()=>{if(d&&!d.el.isConnected)end(false)},400);
  document.addEventListener('pointerdown',e=>{
    if(d&&!d.el.isConnected)end(false);
    const g=e.target.closest&&e.target.closest('.grip');if(!g||e.button>0)return;
    const el=g.closest('[data-ri]'),l=el&&el.closest('[data-rl]');if(!l)return;
    e.preventDefault();begin(el,l,e.clientX,e.clientY);
  },true);
  document.addEventListener('pointermove',e=>{if(d){e.preventDefault();move(e.clientY)}},true);
  document.addEventListener('pointerup',()=>end(true),true);
  document.addEventListener('pointercancel',()=>end(false),true);
  document.addEventListener('touchmove',e=>{if(d&&d.el.isConnected)e.preventDefault()},{passive:false});
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.grip'))e.preventDefault()});
  // un appui sur la poignée n'ouvre jamais l'exercice
  document.addEventListener('click',e=>{if(e.target.closest&&(e.target.closest('.grip')||(Date.now()-sup<400&&e.target.closest('[data-ri]')))){e.stopPropagation();e.preventDefault()}},true);
  // clavier : flèches haut et bas sur la poignée
  document.addEventListener('keydown',e=>{
    const g=e.target.closest&&e.target.closest('.grip');if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
    const el=g.closest('[data-ri]'),l=el&&el.closest('[data-rl]');if(!l)return;e.preventDefault();
    const i=+el.dataset.ri;A.reord(l.dataset.rl,i,i+(e.key==='ArrowUp'?-1:1));
    const n=document.querySelector(`[data-rl="${l.dataset.rl}"] [data-ri="${Math.max(0,i+(e.key==='ArrowUp'?-1:1))}"] .grip`);if(n)n.focus();
  });
})();

/* v60 : la recherche reste visible au-dessus du clavier */
(()=>{
  let lastDown=0;
  const vv=window.visualViewport,setVv=()=>{try{document.documentElement.style.setProperty('--vvh',(vv?vv.height:innerHeight)+'px')}catch(e){}};
  if(vv){vv.addEventListener('resize',setVv);setVv()}
  const ovOf=t=>t&&t.closest?t.closest('.ov'):null;
  document.addEventListener('pointerdown',ev=>{if(ev.target.closest&&ev.target.closest('.sheet.pick'))lastDown=Date.now()},true);
  /* v77 : champ en saisie = clavier ouvert, le minuteur de repos se cache (il prenait tout l'écran au-dessus du clavier) */
  /* v79 : clavier = champ actif ET écran visible raccourci ; « retour » ferme le clavier sans quitter le champ, donc on suit la hauteur */
  let full=vv?vv.height:innerHeight,fw=innerWidth;
  const kOpen=()=>{const h=vv?vv.height:innerHeight;if(innerWidth!==fw){fw=innerWidth;full=h}if(h>full)full=h;return h<full-120};
  const kb=(opt)=>{try{const h=document.documentElement.classList;if(typing()&&(opt===true||kOpen()))h.add('kbd');else h.remove('kbd');restPad()}catch(e){}};
  document.addEventListener('focusin',()=>{kb(true);setTimeout(()=>kb(),700)});
  document.addEventListener('focusout',()=>setTimeout(kb,160));
  if(vv)vv.addEventListener('resize',()=>kb());
  document.addEventListener('focusin',ev=>{
    const t=ev.target,f=t.dataset&&t.dataset.f;
    if(f==='pq'){const o=ovOf(t);if(o){o.classList.add('typing');const l=document.getElementById('pickList');if(l)l.scrollTop=0}}
    else if(f==='exq')setTimeout(()=>{try{t.scrollIntoView({block:'start',behavior:'smooth'})}catch(e){}},350);
  });
  document.addEventListener('focusout',ev=>{
    const t=ev.target;if(!(t.dataset&&t.dataset.f==='pq'))return;
    setTimeout(()=>{if(Date.now()-lastDown<600)return;const o=ovOf(t);if(o)o.classList.remove('typing')},180);
  });
})();
})();
